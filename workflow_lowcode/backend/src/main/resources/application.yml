spring:
  datasource:
    url: jdbc:mysql://192.168.3.237:3306/workflow?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&nullDatabaseMeansCurrent=true
    username: fastmo_user
    password: Fastsun#!mo2023
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    out-of-order: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        globally_quoted_identifiers: false
    show-sql: false

flowable:
  database-schema-update: true
  # 异步执行器必须开启：定时边界事件（timer job 触发）、ServiceTask async/失败重试
  # 均依赖 Job 执行器调度；关闭后定时边界事件永不触发（并行汇聚死锁）
  async-executor-activate: true

# DevTools 热部署配置
spring.devtools.restart.enabled: true

spring.modulith:
  detection-strategy: explicitly-annotated

server:
  port: 8080

logging:
  level:
    com.workflow: DEBUG
    org.flowable: INFO
    org.springframework.modulith: DEBUG
    org.flywaydb: DEBUG

# AI 服务配置：默认走平台内置模型（经 NestJS 内部 LLM 网关，开箱即用，无需外部 API key）。
# 外部部署时可用环境变量覆盖，接入任意 OpenAI 兼容服务（如 DeepSeek）。
workflow:
  ai:
    enabled: true
    base-url: http://192.168.3.8:20128/v1
    api-key: sk-045b33057a64e29e-8bf747-1f6f3a7a
    model: bgcinfo-go-deepseek-v4-flash
    temperature: 0.7
    max-tokens: 4096
    connect-timeout-ms: 5000
    read-timeout-ms: 120000
# 附件上传（Task 146：系统组件·附件）
spring.servlet.multipart:
  enabled: true
  max-file-size: 100MB
  max-request-size: 200MB
  file-size-threshold: 1MB

workflow.attachment:
  storage-path: ${ATTACHMENT_STORAGE_PATH:./data/attachments}
  max-size-mb: 100

# 后端业务逻辑执行（流程节点 logic 项 + 独立逻辑编排共用）
# HTTP 出站白名单：逗号分隔主机，支持精确与 *.example.com 后缀通配；
# 默认空 = 放行全部（首次使用 WARN 一次，生产建议收紧为 api.example.com,*.example.com 形式）
workflow.logic.http.allowed-hosts: ${LOGIC_HTTP_ALLOWED_HOSTS:}
# Groovy 脚本单次执行超时毫秒数（超时 cancel(true) 中断，抛 SCRIPT_TIMEOUT: >Nms）
workflow.logic.script.timeout-ms: ${LOGIC_SCRIPT_TIMEOUT_MS:5000}
